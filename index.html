<!DOCTYPE html>
<html lang="en-SG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Co-Living Spaces – website versions</title>
  <link rel="icon" href="final/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Atkinson Hyperlegible"; src: url("final/fonts/atkinson-hyperlegible-400.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Bricolage Grotesque"; src: url("final/fonts/bricolage-grotesque-800.woff2") format("woff2"); font-weight: 800; }
    body { margin: 0; font-family: "Atkinson Hyperlegible", Arial, sans-serif; background: #0f3d3e; color: #fff; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; box-sizing: border-box; }
    main { width: min(100%, 760px); }
    h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; line-height: 1.1; }
    p { color: #d7e6e0; font-size: 1.1rem; line-height: 1.6; margin: 0 0 2rem; }
    .grid { display: grid; gap: 1.25rem; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    a.card { display: block; background: #fff; color: #1b1f23; text-decoration: none; border-radius: 14px; padding: 1.5rem; border: 3px solid transparent; }
    a.card:hover, a.card:focus-visible { border-color: #f2b705; outline: none; }
    a.card strong { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 1.4rem; color: #0f3d3e; margin-bottom: .4rem; }
    a.card span { color: #4a5a57; }
    .final { box-shadow: 8px 8px 0 #f2b705; }
  </style>
</head>
<body>
  <main>
    <h1>Nexus Co-Living Spaces</h1>
    <p>Two versions of the website: the first prototype that reviewers gave feedback on, and the final version improved using that feedback and testing.</p>
    <div class="grid">
      <a class="card" href="version-1/index.html"><strong>Version 1</strong><span>First prototype, before feedback</span></a>
      <a class="card final" href="final/index.html"><strong>Final version</strong><span>Improved after feedback and testing</span></a>
    </div>
  </main>
</body>
</html>
